apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: user-role-management
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/xothmani/user-role-management
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: user-role-management
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
