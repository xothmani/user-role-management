name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Checkstyle
        working-directory: backend
        run: ../mvnw checkstyle:check

      - name: Test
        working-directory: backend
        run: ../mvnw test

      - name: Package
        working-directory: backend
        run: ../mvnw package -DskipTests

      - name: SonarQube analysis
        working-directory: backend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: >
          ../mvnw sonar:sonar
          -Dsonar.projectKey=xothmani_user-role-management
          -Dsonar.organization=xothmani
          -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }}
          -Dsonar.token=${{ secrets.SONAR_TOKEN }}

      - name: Build backend image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/user-role-management-backend:${{ github.sha }} \
            ./backend

      - name: Trivy scan backend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/user-role-management-backend:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: CRITICAL

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push backend image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/user-role-management-backend:${{ github.sha }}

  frontend-ci:
    runs-on: ubuntu-latest
    needs: backend-ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Lint
        run: cd frontend && npm run lint

      - name: Test
        run: cd frontend && npm test -- --watch=false --browsers=ChromeHeadless

      - name: Build frontend image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/user-role-management-frontend:${{ github.sha }} \
            ./frontend

      - name: Trivy scan frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/user-role-management-frontend:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: CRITICAL

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push frontend image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/user-role-management-frontend:${{ github.sha }}
