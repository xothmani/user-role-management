<div *ngIf="visible" class="modal d-block" tabindex="-1" style="background: rgba(0,0,0,0.5);">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg">
      <div class="modal-header border-0 pb-0">
        <h5 class="modal-title fw-bold">
          <i class="bi bi-exclamation-triangle-fill text-warning me-2"></i>{{ title }}
        </h5>
      </div>
      <div class="modal-body py-3">
        <p class="text-muted mb-0">{{ message }}</p>
      </div>
      <div class="modal-footer border-0 pt-0 gap-2">
        <button type="button" class="btn btn-light" (click)="onCancel()">
          {{ cancelText }}
        </button>
        <button type="button" class="btn btn-danger" (click)="onConfirm()">
          <i class="bi bi-trash me-1"></i>{{ confirmText }}
        </button>
      </div>
    </div>
  </div>
</div>
