<div class="page-header d-flex justify-content-between align-items-center">
  <div>
    <h2 class="mb-1"><i class="bi bi-clock-history me-2 text-primary"></i>Historique</h2>
    <p class="text-muted mb-0 small">Journal des actions système</p>
  </div>
  <button class="btn btn-outline-primary btn-sm" (click)="loadHistorique()">
    <i class="bi bi-arrow-clockwise me-1"></i>Actualiser
  </button>
</div>

<div *ngIf="error" class="alert alert-danger alert-dismissible fade show">
  {{ error }}
  <button type="button" class="btn-close" (click)="error = ''"></button>
</div>

<div class="card mb-3">
  <div class="card-body py-3">
    <form [formGroup]="filterForm" (ngSubmit)="onFilter()" class="row g-3 align-items-end">
      <div class="col-md-4">
        <label class="form-label small fw-medium">Utilisateur</label>
        <select class="form-select form-select-sm" formControlName="userId">
          <option [value]="null">Tous les utilisateurs</option>
          <option *ngFor="let u of utilisateurs" [value]="u.id">{{ u.nom }} ({{ u.email }})</option>
        </select>
      </div>
      <div class="col-md-3">
        <label class="form-label small fw-medium">Date début</label>
        <input type="date" class="form-control form-control-sm" formControlName="dateDebut">
      </div>
      <div class="col-md-3">
        <label class="form-label small fw-medium">Date fin</label>
        <input type="date" class="form-control form-control-sm" formControlName="dateFin">
      </div>
      <div class="col-md-2 d-flex gap-2">
        <button type="submit" class="btn btn-primary btn-sm flex-grow-1">
          <i class="bi bi-funnel me-1"></i>Filtrer
        </button>
        <button type="button" class="btn btn-light btn-sm" (click)="resetFilters()" title="Réinitialiser">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>
    </form>
  </div>
</div>

<div class="card">
  <div class="card-header d-flex justify-content-between align-items-center">
    <span class="fw-semibold">Entrées de journal</span>
    <span class="badge bg-primary rounded-pill">{{ historiques.length }}</span>
  </div>
  <div class="card-body p-0">
    <div *ngIf="loading" class="text-center py-5">
      <div class="spinner-border text-primary"></div>
      <p class="text-muted mt-2">Chargement...</p>
    </div>

    <div *ngIf="!loading && historiques.length === 0" class="text-center py-5">
      <i class="bi bi-journal-x text-muted" style="font-size: 2.5rem;"></i>
      <p class="text-muted mt-2">Aucune entrée trouvée</p>
    </div>

    <div *ngIf="!loading && historiques.length > 0" class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th>#</th>
            <th>Action</th>
            <th>Utilisateur</th>
            <th>Email</th>
            <th>Date & Heure</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let h of historiques">
            <td class="text-muted small">{{ h.id }}</td>
            <td>
              <span [class]="'badge rounded-pill ' + getActionBadgeClass(h.action)">
                {{ h.action }}
              </span>
            </td>
            <td>{{ h.utilisateurNom || '—' }}</td>
            <td class="text-muted small">{{ h.utilisateurEmail || '—' }}</td>
            <td>
              <span class="text-muted small">
                <i class="bi bi-calendar3 me-1"></i>{{ formatDate(h.date) }}
              </span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
