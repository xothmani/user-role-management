<div class="page-header">
  <nav aria-label="breadcrumb">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a routerLink="/roles">Rôles</a></li>
      <li class="breadcrumb-item active">{{ isEditMode ? 'Modifier' : 'Nouveau rôle' }}</li>
    </ol>
  </nav>
  <h2 class="mb-0">
    <i class="bi bi-shield-gear me-2 text-primary"></i>
    {{ isEditMode ? 'Modifier le rôle' : 'Nouveau rôle' }}
  </h2>
</div>

<div *ngIf="loading" class="text-center py-5">
  <div class="spinner-border text-primary"></div>
</div>

<div *ngIf="!loading" class="row justify-content-center">
  <div class="col-lg-7">
    <div class="card">
      <div class="card-body p-4">
        <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

        <form [formGroup]="form" (ngSubmit)="onSubmit()">
          <div class="mb-3">
            <label class="form-label">Nom du rôle <span class="text-danger">*</span></label>
            <input type="text" class="form-control"
                   [class.is-invalid]="f['nom'].invalid && f['nom'].touched"
                   formControlName="nom" placeholder="ADMIN">
            <div class="invalid-feedback">Le nom doit contenir au moins 2 caractères.</div>
          </div>

          <div class="mb-4">
            <label class="form-label">Description</label>
            <textarea class="form-control" formControlName="description" rows="2"
                      placeholder="Description du rôle..."></textarea>
          </div>

          <div class="mb-4">
            <label class="form-label fw-semibold">
              <i class="bi bi-key me-1 text-primary"></i>Permissions
            </label>
            <div *ngIf="allPermissions.length === 0" class="text-muted small">
              Aucune permission disponible.
            </div>
            <div class="row g-2 mt-1">
              <div *ngFor="let perm of allPermissions" class="col-md-6">
                <div class="form-check p-3 border rounded"
                     [class.border-primary]="isPermissionSelected(perm.id!)"
                     [class.bg-primary-subtle]="isPermissionSelected(perm.id!)"
                     style="cursor: pointer;"
                     (click)="togglePermission(perm.id!)">
                  <input class="form-check-input" type="checkbox"
                         [checked]="isPermissionSelected(perm.id!)"
                         [id]="'perm-' + perm.id"
                         (click)="$event.stopPropagation()">
                  <label class="form-check-label ms-2 w-100" [for]="'perm-' + perm.id"
                         style="cursor: pointer;">
                    <span class="fw-medium d-block">{{ perm.nom }}</span>
                    <small class="text-muted">{{ perm.description }}</small>
                  </label>
                </div>
              </div>
            </div>
            <div class="mt-2">
              <small class="text-muted">
                {{ selectedPermissionIds.size }} permission(s) sélectionnée(s)
              </small>
            </div>
          </div>

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary" [disabled]="saving">
              <span *ngIf="saving" class="spinner-border spinner-border-sm me-2"></span>
              <i *ngIf="!saving" class="bi bi-check-lg me-2"></i>
              {{ saving ? 'Enregistrement...' : 'Enregistrer' }}
            </button>
            <a routerLink="/roles" class="btn btn-light">
              <i class="bi bi-arrow-left me-2"></i>Annuler
            </a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
