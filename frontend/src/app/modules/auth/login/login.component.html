<div class="login-container">
  <div class="login-card card shadow-lg">
    <div class="card-body">
      <div class="text-center mb-4">
        <div class="login-logo">
          <i class="bi bi-shield-lock-fill"></i>
        </div>
        <h3 class="fw-bold text-dark mb-1">Connexion</h3>
        <p class="text-muted small">Gestion Utilisateurs & Rôles</p>
      </div>

      <div *ngIf="error" class="alert alert-danger d-flex align-items-center gap-2" role="alert">
        <i class="bi bi-exclamation-circle-fill"></i>
        <span>{{ error }}</span>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label class="form-label">Adresse email</label>
          <div class="input-group">
            <span class="input-group-text bg-light">
              <i class="bi bi-envelope"></i>
            </span>
            <input
              type="email"
              class="form-control"
              [class.is-invalid]="f['email'].invalid && f['email'].touched"
              formControlName="email"
              placeholder="admin@app.com"
              autocomplete="email"
            />
            <div class="invalid-feedback">Email invalide.</div>
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label">Mot de passe</label>
          <div class="input-group">
            <span class="input-group-text bg-light">
              <i class="bi bi-lock"></i>
            </span>
            <input
              [type]="showPassword ? 'text' : 'password'"
              class="form-control"
              [class.is-invalid]="f['motDePasse'].invalid && f['motDePasse'].touched"
              formControlName="motDePasse"
              placeholder="••••••••"
              autocomplete="current-password"
            />
            <button class="btn btn-outline-secondary" type="button"
                    (click)="showPassword = !showPassword">
              <i [class]="showPassword ? 'bi bi-eye-slash' : 'bi bi-eye'"></i>
            </button>
            <div class="invalid-feedback">Minimum 6 caractères.</div>
          </div>
        </div>

        <button
          type="submit"
          class="btn btn-primary w-100 py-2 fw-semibold"
          [disabled]="loading"
        >
          <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
          <i *ngIf="!loading" class="bi bi-box-arrow-in-right me-2"></i>
          {{ loading ? 'Connexion...' : 'Se connecter' }}
        </button>
      </form>
    </div>
  </div>
</div>
